[advisories]
unmaintained = "none"
yanked = "warn"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
]
confidence-threshold = 0.7

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"
