name: Dependency Audit

# Scheduled, non-PR-blocking supply-chain scan (#646). Catches advisories
# published against already-merged dependency versions — routine version
# updates are handled separately by dependabot.yml on a monthly cadence.
# See .github/CONTRIBUTING.md § 9 (Dependency update policy) for response
# windows by severity.

on:
  schedule:
    # Every Monday at 07:00 UTC (offset from the 06:00 scanner-testnet job).
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  cargo-audit:
    name: cargo audit / cargo deny
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-audit and cargo-deny
        run: cargo install cargo-audit cargo-deny --locked

      - name: cargo audit
        run: cargo audit

      - name: cargo deny check
        run: cargo deny check

  npm-audit:
    name: npm supply-chain audit
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Audit production dependency trees
        run: npm run audit:supply-chain
