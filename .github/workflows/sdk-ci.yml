name: SDK CI

on:
  push:
    branches: [main, master]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-ci.yml"

# Cancel superseded runs on the same ref.
concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the SDK CI only reads the repo.
permissions:
  contents: read

defaults:
  run:
    working-directory: sdk

jobs:
  verify:
    name: Lint, typecheck, and package correctness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build (ESM + CJS + types)
        run: npm run build
      - name: Validate published package (publint + are-the-types-wrong)
        run: npm run check:exports

  clean-room:
    name: Clean-room install (packaged consumer)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - name: Pack, install with required peers only, and run ESM/CJS consumers
        run: npm run smoke:install

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Unit + e2e tests
        # Artifact-gated proof tests and the testnet integration tests skip
        # automatically when their inputs are absent (the default CI case).
        run: npm test

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - name: Build VitePress docs
        run: npm run docs:build

  testnet-smoke:
    name: Live testnet smoke (non-blocking)
    # Only on push to the main branches; never blocks the merge.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - name: Read-only testnet integration tests
        env:
          OPAQUE_E2E_TESTNET: "1"
        run: npx vitest run tests/integration
