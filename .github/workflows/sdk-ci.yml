name: SDK CI

on:
  push:
    branches: [main, master]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-ci.yml"

jobs:
  build-and-test:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (ESM + CJS + types)
        run: npm run build

      - name: Test
        # Artifact-gated proof tests and the testnet integration test skip
        # automatically when their inputs are absent (the default CI case).
        run: npm test

      - name: Verify publishable package contents
        run: npm pack --dry-run
