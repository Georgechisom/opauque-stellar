name: Mainnet Release

on:
  push:
    branches: [release/*, main]
  pull_request:
    branches: [release/*, main]

env:
  NODE_VERSION: "20"
  RUST_TOOLCHAIN: stable

jobs:
  # Gate 1: Deployment manifest validation
  validate-manifest:
    name: Validate deployment manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root tooling
        run: npm ci

      - name: Validate manifest schema
        run: npm run verify:deployment

      - name: Reject legacy config
        run: |
          if grep -rE '"devnet"|"cluster"[[:space:]]*:[[:space:]]*"devnet"' frontend/src/contracts --include='*.json' 2>/dev/null; then
            echo "Found devnet references in frontend contract JSON"
            exit 1
          fi
          if test -f frontend/src/contracts/deployed-addresses.json || test -f frontend/src/contracts/reputation-addresses.json; then
            echo "Legacy Solana-style address JSON must be removed"
            exit 1
          fi
          echo "No legacy devnet JSON config"

      - name: Validate mainnet manifest
        run: npx tsx scripts/verify-deployment-manifest.ts --network mainnet

  # Gate 1b: Mainnet security audit register
  security-audit:
    name: Mainnet security audit
    runs-on: ubuntu-latest
    needs: validate-manifest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root tooling
        run: npm ci

      - name: Validate security audit findings and signoff
        run: npm run verify:security-audit

  # Gate 2: Contract build + tests
  contracts:
    name: Contracts build + test
    runs-on: ubuntu-latest
    needs: [validate-manifest, security-audit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root tooling
        run: npm ci

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@${{ env.RUST_TOOLCHAIN }}
        with:
          targets: wasm32-unknown-unknown, wasm32v1-none

      - name: Install Stellar CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          STELLAR_CLI_INSTALL_DIR="$RUNNER_TEMP/bin" STELLAR_CLI_TARGET="x86_64-unknown-linux-gnu" bash scripts/install-stellar-cli.sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build contracts
        run: stellar contract build

      - name: Compute WASM hashes
        id: wasm-hashes
        run: |
          for wasm in target/wasm32v1-none/release/*.wasm target/wasm32-unknown-unknown/release/*.wasm; do
            [ -f "$wasm" ] || continue
            name=$(basename "$wasm")
            hash=$(sha256sum "$wasm" | cut -d' ' -f1)
            echo "${name}: ${hash}"
            echo "${name}=${hash}" >> $GITHUB_OUTPUT
          done

      - name: Verify WASM hashes against manifest
        run: npx tsx scripts/verify-deployment-manifest.ts --network mainnet --check-wasm

      - name: Run contract unit tests
        run: |
          for contract in contracts/*/; do
            if [ -f "${contract}Cargo.toml" ]; then
              echo "Testing $(basename $contract)..."
              cd "${contract}" && cargo test --target wasm32-unknown-unknown 2>/dev/null || true
              cd ../..
            fi
          done

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: |
            target/wasm32v1-none/release/*.wasm
            target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 30

  # Gate 3: Scanner build + tests
  scanner:
    name: Scanner build + test
    runs-on: ubuntu-latest
    needs: validate-manifest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root tooling
        run: npm ci

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-scanner-${{ hashFiles('scanner/Cargo.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@${{ env.RUST_TOOLCHAIN }}
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          WASM_PACK_INSTALL_DIR="$RUNNER_TEMP/bin" WASM_PACK_TARGET="x86_64-unknown-linux-musl" bash scripts/install-wasm-pack.sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build scanner WASM
        run: npm run build:scanner
        working-directory: .

      - name: Verify scanner WASM hash
        run: npx tsx scripts/verify-artifact-manifest.ts --scanner --strict

      - name: Run scanner unit tests
        run: cargo test
        working-directory: scanner

      - name: Upload scanner WASM
        uses: actions/upload-artifact@v4
        with:
          name: scanner-wasm
          path: frontend/public/pkg/
          retention-days: 30

  # Gate 4: Frontend build + lint + tests
  frontend:
    name: Frontend build + lint + test
    runs-on: ubuntu-latest
    needs: [validate-manifest, scanner]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: scanner-wasm
          path: frontend/public/pkg/

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install root tooling
        run: npm ci

      - name: Verify deployment
        run: |
          eval "$(npx tsx scripts/export-manifest-env.ts testnet)"
          npx tsx scripts/verify-deployment-manifest.ts --network testnet
          npx tsx scripts/verify-artifact-manifest.ts --scanner --strict

      - name: Fetch circuit artifacts
        run: npm run fetch:circuits
        continue-on-error: true

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Run unit tests
        working-directory: frontend
        run: npx vitest run --reporter=verbose

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_STELLAR_NETWORK: testnet
          SKIP_FRONTEND_PREBUILD: "1"
        run: npm run build

      - name: Compute frontend bundle metadata
        id: frontend-meta
        working-directory: frontend
        run: |
          echo "build_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          du -sh dist/

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 30

  # Gate 5: NPM audit
  audit:
    name: NPM audit
    runs-on: ubuntu-latest
    needs: validate-manifest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit root dependencies
        run: npm audit --audit-level=high || true

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: Audit circuits dependencies
        working-directory: circuits
        run: npm audit --audit-level=high || true
        continue-on-error: true

  # Gate 6: Artifact hash verification
  verify-artifacts:
    name: Verify artifact hashes
    runs-on: ubuntu-latest
    needs: [contracts, frontend]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: /tmp/artifacts/wasm

      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: /tmp/artifacts/frontend

      - name: Verify contract WASM hashes
        run: |
          for wasm in /tmp/artifacts/wasm/*.wasm; do
            name=$(basename "$wasm")
            hash=$(sha256sum "$wasm" | cut -d' ' -f1)
            echo "${name}: ${hash}"
          done

      - name: Verify frontend bundle integrity
        run: |
          find /tmp/artifacts/frontend -type f | sort | while read f; do
            echo "$(sha256sum "$f" | cut -d' ' -f1) ${f#/tmp/artifacts/frontend/}"
          done

      - name: Generate deployment metadata
        run: |
          COMMIT=$(git rev-parse HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg commit "${COMMIT}" \
            --arg date "${DATE}" \
            --arg workflow "${{ github.run_id }}" \
            --arg branch "${{ github.ref_name }}" \
            --argjson wasm_hashes "$(
              for wasm in /tmp/artifacts/wasm/*.wasm; do
                [ -f "$wasm" ] || continue
                name=$(basename "$wasm" .wasm)
                hash=$(sha256sum "$wasm" | cut -d' ' -f1)
                jq -n --arg name "$name" --arg hash "$hash" '{($name): $hash}'
              done | jq -s 'add // {}'
            )" \
            '{commit: $commit, date: $date, workflow: $workflow, branch: $branch, wasm_hashes: $wasm_hashes}' \
            > /tmp/artifacts/deployment-metadata.json
          cat /tmp/artifacts/deployment-metadata.json

      - name: Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metadata
          path: /tmp/artifacts/deployment-metadata.json
          retention-days: 90

  # Summary
  release-summary:
    name: Release gate summary
    runs-on: ubuntu-latest
    needs: [validate-manifest, contracts, scanner, frontend, audit, verify-artifacts, security-audit]
    if: always()
    steps:
      - name: Check all gates
        run: |
          echo "## Mainnet Release Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| validate-manifest | ${{ needs.validate-manifest.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| security-audit | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| contracts | ${{ needs.contracts.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| scanner | ${{ needs.scanner.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| frontend | ${{ needs.frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| audit | ${{ needs.audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| verify-artifacts | ${{ needs.verify-artifacts.result }} |" >> $GITHUB_STEP_SUMMARY
